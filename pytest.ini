[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short traceback, verbose test names
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header

# Coverage (used when --cov flag is passed)
# Run with: pytest --cov=backend --cov-report=term-missing
# or:        pytest --cov=backend --cov-report=html

markers =
    unit: Pure unit tests — no DB, no LLM
    integration: Integration tests — real DB (SQLite in-memory), LLM mocked

# Minimum coverage threshold — CI fails below this
# Enforced via: pytest --cov=backend --cov-fail-under=75
