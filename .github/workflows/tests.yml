name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Python + uv ───────────────────────────────────────────────────────────
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      # ── Install dependencies ───────────────────────────────────────────────────
      - name: Install project + dev dependencies
        run: uv sync --extra dev
        env:
          UV_LINK_MODE: copy

      # ── Unit tests ─────────────────────────────────────────────────────────────
      - name: Run unit tests
        run: |
          uv run pytest tests/unit/ \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            -v --tb=short
        env:
          DATABASE_URL: "sqlite:///:memory:"
          AZURE_OPENAI_KEY: "mock-key"
          AZURE_OPENAI_ENDPOINT: "https://mock.openai.azure.com/"
          AZURE_OPENAI_API_VERSION: "2025-01-01-preview"
          AZURE_OPENAI_DEPLOYMENT: "gpt-mock"
          LANGFUSE_PUBLIC_KEY: "pk-mock"
          LANGFUSE_SECRET_KEY: "sk-mock"
          LANGFUSE_BASE_URL: "https://mock.langfuse.com"
          JWT_SECRET_KEY: "test-secret-key-for-ci"

      # ── Integration tests ──────────────────────────────────────────────────────
      - name: Run integration tests
        run: |
          uv run pytest tests/integration/ \
            --cov=backend \
            --cov-report=xml \
            --cov-append \
            -v --tb=short
        env:
          DATABASE_URL: "sqlite:///:memory:"
          AZURE_OPENAI_KEY: "mock-key"
          AZURE_OPENAI_ENDPOINT: "https://mock.openai.azure.com/"
          AZURE_OPENAI_API_VERSION: "2025-01-01-preview"
          AZURE_OPENAI_DEPLOYMENT: "gpt-mock"
          LANGFUSE_PUBLIC_KEY: "pk-mock"
          LANGFUSE_SECRET_KEY: "sk-mock"
          LANGFUSE_BASE_URL: "https://mock.langfuse.com"
          JWT_SECRET_KEY: "test-secret-key-for-ci"

      # ── Coverage gate ──────────────────────────────────────────────────────────
      - name: Enforce 60% coverage minimum
        run: |
          uv run pytest tests/ \
            --cov=backend \
            --cov-fail-under=60 \
            -q --tb=short
        env:
          DATABASE_URL: "sqlite:///:memory:"
          AZURE_OPENAI_KEY: "mock-key"
          AZURE_OPENAI_ENDPOINT: "https://mock.openai.azure.com/"
          AZURE_OPENAI_API_VERSION: "2025-01-01-preview"
          AZURE_OPENAI_DEPLOYMENT: "gpt-mock"
          LANGFUSE_PUBLIC_KEY: "pk-mock"
          LANGFUSE_SECRET_KEY: "sk-mock"
          LANGFUSE_BASE_URL: "https://mock.langfuse.com"
          JWT_SECRET_KEY: "test-secret-key-for-ci"

      # ── Upload coverage to GitHub ──────────────────────────────────────────────
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
